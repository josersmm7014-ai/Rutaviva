name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Descomprimir el proyecto
        run: unzip -o rutaviva_driver_fase3.zip -d src

      - name: Crear scaffold Android
        run: |
          flutter create --org com.rutaviva --project-name rutaviva --platforms=android _scaffold
          rm -rf _scaffold/lib
          sed -i 's/recognizer.recognizeText(input)/recognizer.processImage(input)/' src/lib/ocr.dart
          cp -r src/lib _scaffold/lib
          cp src/pubspec.yaml _scaffold/pubspec.yaml
          python3 src/tool/patch_manifest.py _scaffold/android/app/src/main/AndroidManifest.xml

      - name: Reglas R8 para ML Kit
        run: |
          cat > _scaffold/android/app/proguard-rules.pro <<'RULES'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES
          python3 - <<'PYEOF'
          import glob
          for p in glob.glob('_scaffold/android/app/build.gradle*'):
              s = open(p).read()
              if 'proguard-rules.pro' in s:
                  continue
              if p.endswith('.kts'):
                  old = 'signingConfig = signingConfigs.getByName("debug")'
                  new = old + '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              else:
                  old = 'signingConfig signingConfigs.debug'
                  new = old + "\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
              assert old in s, 'no se encontro el bloque release'
              open(p, 'w').write(s.replace(old, new, 1))
              print('patched', p)
          PYEOF

      - name: Compilar APK
        working-directory: _scaffold
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rutaviva-apk
          path: _scaffold/build/app/outputs/flutter-apk/app-release.apk
