name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Descomprimir el proyecto
        run: unzip -o rutaviva_driver_fase2.zip -d src

      - name: Crear scaffold Android
        run: |
          flutter create --org com.rutaviva --project-name rutaviva --platforms=android _scaffold
          rm -rf _scaffold/lib
          cp -r src/lib _scaffold/lib
          cp src/pubspec.yaml _scaffold/pubspec.yaml
          python3 src/tool/patch_manifest.py _scaffold/android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        working-directory: _scaffold
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rutaviva-apk
          path: _scaffold/build/app/outputs/flutter-apk/app-release.apk
